<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Linear and circular polarization</title><desc id="d">Left: snapshots of the electric field along the direction of travel. For linear polarization the arrows stay in one vertical plane and trace a sine wave. For circular polarization the arrows keep the same length and rotate, tracing a helix. Right: the same waves seen end-on, a line and a circle, and two linear antennas tilted by an angle psi, which receive cos squared psi of the power.</desc>
<defs><marker id="ah555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#555"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker></defs>
<rect width="760" height="360" fill="#ffffff"/>
