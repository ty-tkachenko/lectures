<title id="t">RLGC model of a transmission line</title><desc id="d">A transmission line drawn as a chain of identical short slices. Each slice of length delta z has a series resistance R delta z and inductance L delta z in the signal conductor, and a shunt conductance G delta z and capacitance C delta z between signal and return.</desc>
