<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Copper loss and dielectric loss versus frequency for a 50 ohm microstrip</title><desc id="d">Log-log plot of loss in dB per metre from 10 MHz to 20 GHz for a 50 ohm microstrip on 0.5 mm dielectric. Copper loss grows as the square root of frequency, dielectric loss grows linearly. On FR-4 the dielectric loss overtakes the copper loss at about 240 MHz; on RO4350B at about 6 GHz.</desc>
<rect width="760" height="380" fill="#ffffff"/>
<text x="20" y="24" font-size="14" fill="#2b2b2b" font-weight="600">Copper loss grows like √f, dielectric loss like f: the dielectric always wins eventually</text>
