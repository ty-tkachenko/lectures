<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">A dB cascade: source, cable, amplifier, filter, attenuator</title><desc id="d">A 0 dBm source feeds a cable of minus 1 dB, an amplifier of plus 15 dB, a filter of minus 2 dB and an attenuator of minus 6 dB. The power after each block is minus 1, plus 14, plus 12 and plus 6 dBm.</desc>
<defs><marker id="ah2b2b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2b2b2b"/></marker></defs>
<rect width="760" height="210" fill="#ffffff"/>
<text x="20" y="24" font-size="14" fill="#2b2b2b" font-weight="600">Following a signal down a chain: in dB you just add</text>
<rect x="20" y="62" width="92" height="50" rx="8" stroke="#94a3b8" stroke-width="1" fill="#eff6ff"/>
<text x="66" y="83" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="600">source</text>
<text x="66" y="101" font-size="12" fill="#1d4ed8" text-anchor="middle">0 dBm</text>
<line x1="114" y1="87" x2="150" y2="87" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah2b2b2b)"/>
<text x="132" y="144" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">0 dBm</text>
<text x="132" y="160" font-size="10.5" fill="#555" text-anchor="middle">1 mW</text>
<rect x="152" y="62" width="92" height="50" rx="8" stroke="#94a3b8" stroke-width="1" fill="#fef2f2"/>
<text x="198" y="83" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="600">cable</text>
<text x="198" y="101" font-size="12" fill="#b91c1c" text-anchor="middle">−1 dB</text>
<line x1="246" y1="87" x2="282" y2="87" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah2b2b2b)"/>
<text x="264" y="144" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">−1 dBm</text>
<text x="264" y="160" font-size="10.5" fill="#555" text-anchor="middle">0.794 mW</text>
<rect x="284" y="62" width="92" height="50" rx="8" stroke="#94a3b8" stroke-width="1" fill="#dcfce7"/>
<text x="330" y="83" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="600">amplifier</text>
<text x="330" y="101" font-size="12" fill="#15803d" text-anchor="middle">+15 dB</text>
<line x1="378" y1="87" x2="414" y2="87" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah2b2b2b)"/>
<text x="396" y="144" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">+14 dBm</text>
<text x="396" y="160" font-size="10.5" fill="#555" text-anchor="middle">25.1 mW</text>
<rect x="416" y="62" width="92" height="50" rx="8" stroke="#94a3b8" stroke-width="1" fill="#fef2f2"/>
<text x="462" y="83" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="600">filter</text>
<text x="462" y="101" font-size="12" fill="#b91c1c" text-anchor="middle">−2 dB</text>
<line x1="510" y1="87" x2="546" y2="87" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah2b2b2b)"/>
<text x="528" y="144" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">+12 dBm</text>
<text x="528" y="160" font-size="10.5" fill="#555" text-anchor="middle">15.8 mW</text>
<rect x="548" y="62" width="92" height="50" rx="8" stroke="#94a3b8" stroke-width="1" fill="#fef2f2"/>
<text x="594" y="83" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="600">attenuator</text>
<text x="594" y="101" font-size="12" fill="#b91c1c" text-anchor="middle">−6 dB</text>
<line x1="642" y1="87" x2="678" y2="87" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#ah2b2b2b)"/>
<text x="710" y="144" font-size="12.5" fill="#1d4ed8" text-anchor="middle" font-weight="600">+6 dBm</text>
<text x="710" y="160" font-size="10.5" fill="#555" text-anchor="middle">3.98 mW</text>
<text x="710" y="92" font-size="12" fill="#555" text-anchor="middle">out</text>
<text x="20" y="196" font-size="11.5" fill="#555" font-style="italic">Total gain = −1 + 15 − 2 − 6 = +6 dB, so 0 dBm in gives +6 dBm (3.98 mW) out. Numbers under the arrows are the power at that point.</text>
</svg>