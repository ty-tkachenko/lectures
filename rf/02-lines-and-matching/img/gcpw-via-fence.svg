<title id="t">GCPW via fence, top view</title><desc id="d">Top view of a grounded coplanar waveguide: a centre trace, a gap on each side, and top-side ground copper with a row of vias along each gap. The via pitch must be at most lambda/10 at the highest frequency, about 6.8 mm at 2.4 GHz on FR-4, and lambda/20 (3.4 mm) to be conservative.</desc>
