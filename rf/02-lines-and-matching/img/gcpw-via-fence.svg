<text x="48" y="111" font-size="10.5" fill="#15803d">gap</text>
<text x="48" y="203" font-size="11.5" fill="#3b2410">top-side ground copper (tied to the plane below by the vias)</text>
<text x="20" y="220" font-size="12" fill="#2b2b2b">Keep s ≤ λ/10 at the highest frequency you care about, harmonics included; λ/20 to be conservative.</text>
<text x="20" y="238" font-size="11.5" fill="#555" font-style="italic">2.4 GHz on FR-4 (λg ≈ 68 mm): λ/10 = 6.8 mm, λ/20 = 3.4 mm. At the 3rd harmonic (7.2 GHz) it is a third of that. Not to scale.</text>
