<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="buckTitle buckDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="buckTitle">Buck converter, switch closed and switch open</title>
  <desc id="buckDesc">Two moments of a buck converter. On the left the high-side switch is closed: the input feeds the inductor and the output capacitor, and the inductor current rises. On the right the switch is open and the low-side diode or transistor conducts: the inductor keeps current flowing into the output, and the current falls. The output capacitor holds the voltage up between the two moments.</desc>
  <rect x="1" y="1" width="718" height="458" fill="#fff" stroke="#111"/>
  <text x="20" y="34" font-size="22" fill="#111">Buck: the switch chops, the inductor averages</text>
  <text x="20" y="70" font-size="20" fill="#111">Switch closed</text>
  <text x="380" y="70" font-size="20" fill="#111">Switch open</text>
  <line x1="360" y1="50" x2="360" y2="400" stroke="#c0c0c0" stroke-width="2"/>
  <text x="20" y="110" font-size="18" fill="#111">Vin</text>
  <line x1="20" y1="130" x2="70" y2="130" stroke="#0000cc" stroke-width="4"/>
  <rect x="70" y="112" width="54" height="36" fill="#111"/>
  <text x="78" y="136" font-size="16" fill="#fff">on</text>
  <line x1="124" y1="130" x2="180" y2="130" stroke="#0000cc" stroke-width="4"/>
  <path d="M180 110 C200 110 200 150 220 150" fill="none" stroke="#111" stroke-width="3"/>
  <text x="168" y="100" font-size="18" fill="#111">L</text>
  <line x1="220" y1="150" x2="300" y2="150" stroke="#0000cc" stroke-width="4"/>
  <text x="250" y="140" font-size="18" fill="#111">Vout</text>
  <line x1="300" y1="150" x2="300" y2="210" stroke="#0000cc" stroke-width="4"/>
  <rect x="270" y="210" width="60" height="36" fill="#fff" stroke="#0000cc" stroke-width="3"/>
  <text x="286" y="234" font-size="16" fill="#111">C</text>
  <line x1="300" y1="246" x2="300" y2="290" stroke="#0000cc" stroke-width="4"/>
  <line x1="270" y1="290" x2="330" y2="290" stroke="#111" stroke-width="3"/>
  <text x="20" y="340" font-size="18" fill="#111">Current in L rises.</text>
  <text x="20" y="368" font-size="18" fill="#111">Voltage on L is Vin - Vout.</text>
  <text x="380" y="110" font-size="18" fill="#111">Vin</text>
  <line x1="380" y1="130" x2="430" y2="130" stroke="#111" stroke-width="3"/>
  <rect x="430" y="112" width="54" height="36" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="438" y="136" font-size="16" fill="#111">off</text>
  <line x1="457" y1="148" x2="457" y2="200" stroke="#0000cc" stroke-width="4"/>
  <polygon points="457,210 447,190 467,190" fill="#0000cc"/>
  <text x="470" y="200" font-size="16" fill="#111">low side</text>
  <line x1="457" y1="210" x2="457" y2="290" stroke="#0000cc" stroke-width="4"/>
  <line x1="430" y1="290" x2="560" y2="290" stroke="#111" stroke-width="3"/>
  <line x1="484" y1="130" x2="540" y2="130" stroke="#111" stroke-width="3"/>
  <path d="M540 110 C560 110 560 150 580 150" fill="none" stroke="#111" stroke-width="3"/>
  <text x="528" y="100" font-size="18" fill="#111">L</text>
  <line x1="580" y1="150" x2="660" y2="150" stroke="#0000cc" stroke-width="4"/>
  <line x1="660" y1="150" x2="660" y2="210" stroke="#0000cc" stroke-width="4"/>
  <rect x="630" y="210" width="60" height="36" fill="#fff" stroke="#0000cc" stroke-width="3"/>
  <text x="646" y="234" font-size="16" fill="#111">C</text>
  <line x1="660" y1="246" x2="660" y2="290" stroke="#0000cc" stroke-width="4"/>
  <text x="380" y="340" font-size="18" fill="#111">Current in L falls, but keeps flowing.</text>
  <text x="380" y="368" font-size="18" fill="#111">Voltage on L is -Vout.</text>
  <text x="20" y="420" font-size="18" fill="#111">The blue path is where the inductor current is flowing in that half of the cycle.</text>
  <text x="20" y="446" font-size="18" fill="#111">Average output is about D times Vin, with D the fraction of time the switch is closed.</text>
</svg>
