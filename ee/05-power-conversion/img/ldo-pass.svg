<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">PMOS low-dropout regulator</title>
<desc id="d">An LDO with a P-channel MOSFET pass element. The source connects to Vin and the drain to Vout. The gate is on the left, and the body arrow points out toward the source. The error amplifier is a triangle pointing right. Its output drives the gate. The feedback divider goes to the plus input, and a reference source goes from the minus input to ground. Cin, Cout, and the load return to one ground rail. Heat in the MOSFET is (Vin minus Vout) times the load current.</desc>
<rect width="760" height="470" fill="#ffffff"/>
<text x="20" y="26" font-size="14" font-weight="600" fill="#2b2b2b">LDO: a PMOS pass element drops the spare volts</text>
<text x="430" y="48" font-size="12" font-weight="600" fill="#b45309">P = (V<tspan baseline-shift="sub" font-size="75%">in</tspan> − V<tspan baseline-shift="sub" font-size="75%">out</tspan>) · I<tspan baseline-shift="sub" font-size="75%">load</tspan></text>
<text x="430" y="66" font-size="11" fill="#b45309">heat in the pass element</text>
<text x="430" y="84" font-size="11" fill="#b45309">dropout ≈ R<tspan baseline-shift="sub" font-size="75%">DS(on)</tspan> · I</text>

<!-- Vin terminal. The rail meets the open circle. -->
<circle cx="48" cy="118" r="5.5" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="48" y="102" font-size="12" fill="#2b2b2b" text-anchor="middle">Vin</text>
<line x1="53" y1="118" x2="390" y2="118" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- Cin, left of the amplifier -->
<circle cx="118" cy="118" r="3" fill="#2b2b2b"/>
<line x1="118" y1="118" x2="118" y2="150" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="104" y1="150" x2="132" y2="150" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="104" y1="160" x2="132" y2="160" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<text x="140" y="160" font-size="12" fill="#2b2b2b">Cin</text>
<line x1="118" y1="160" x2="118" y2="404" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- PMOS. Source on Vin, drain on Vout, gate on the left. Arrow points out, toward Vin. -->
<line x1="390" y1="118" x2="390" y2="130" stroke="#2b2b2b" stroke-width="1.6"/>
<polygon points="390,130 383,144 397,144" fill="#2b2b2b"/>
<line x1="390" y1="144" x2="390" y2="160" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="406" y="142" font-size="12" font-weight="600" fill="#2b2b2b">S</text>
<line x1="376" y1="160" x2="404" y2="160" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="376" y1="174" x2="404" y2="174" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="376" y1="188" x2="404" y2="188" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="358" y1="152" x2="358" y2="196" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="390" y1="188" x2="390" y2="236" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="406" y="214" font-size="12" font-weight="600" fill="#2b2b2b">D</text>

<!-- Vout rail and terminal -->
<line x1="390" y1="236" x2="686" y2="236" stroke="#2b2b2b" stroke-width="1.6"/>
<circle cx="692" cy="236" r="5.5" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="692" y="220" font-size="12" fill="#2b2b2b" text-anchor="middle">Vout</text>

<!-- error amplifier, triangle pointing right -->
<polygon points="196,276 196,356 292,316" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/>
<text x="210" y="300" font-size="14" fill="#2b2b2b">+</text>
<text x="210" y="340" font-size="14" fill="#2b2b2b">−</text>
<text x="196" y="268" font-size="11" fill="#555">error amp</text>

<!-- feedback, blue, into the plus input. The gate wire bridges over it. -->
<line x1="168" y1="296" x2="196" y2="296" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="168" y1="296" x2="168" y2="250" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="168" y1="250" x2="478" y2="250" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="478" y1="250" x2="478" y2="328" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="478" y1="328" x2="512" y2="328" stroke="#1d4ed8" stroke-width="1.6"/>

<!-- hop bulges right, over the feedback wire, then the gate wire is drawn on top -->
<path d="M328,266 A16,16 0 0 0 328,234" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="butt"/>
<path d="M328,266 A16,16 0 0 0 328,234" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="butt"/>
<line x1="292" y1="316" x2="328" y2="316" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="328" y1="316" x2="328" y2="258" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="328" y1="242" x2="328" y2="167" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="328" y1="167" x2="358" y2="167" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- divider: R1 from Vout to FB, R2 from FB to ground -->
<circle cx="512" cy="236" r="3" fill="#2b2b2b"/>
<path d="M512,236 L512,256 L517,262 L507,268 L517,274 L507,280 L517,286 L507,292 L517,298 L512,304 L512,328" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="526" y="278" font-size="12" fill="#2b2b2b">R1</text>
<circle cx="512" cy="328" r="3" fill="#1d4ed8"/>
<text x="526" y="324" font-size="12" font-weight="600" fill="#1d4ed8">FB</text>
<path d="M512,328 L512,348 L517,354 L507,360 L517,366 L507,372 L517,378 L507,384 L512,390 L512,404" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="526" y="372" font-size="12" fill="#2b2b2b">R2</text>

<!-- Vref from the minus input to the ground rail -->
<line x1="168" y1="336" x2="196" y2="336" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="168" y1="336" x2="168" y2="366" stroke="#2b2b2b" stroke-width="1.6"/>
<circle cx="168" cy="380" r="14" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="168" y="383" font-size="9" fill="#2b2b2b" text-anchor="middle">Vref</text>
<line x1="168" y1="394" x2="168" y2="404" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- Cout -->
<circle cx="590" cy="236" r="3" fill="#2b2b2b"/>
<line x1="590" y1="236" x2="590" y2="268" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="576" y1="268" x2="604" y2="268" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="576" y1="278" x2="604" y2="278" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<text x="612" y="278" font-size="12" fill="#2b2b2b">Cout</text>
<line x1="590" y1="278" x2="590" y2="404" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- load -->
<circle cx="662" cy="236" r="3" fill="#2b2b2b"/>
<path d="M662,236 L662,258 L667,264 L657,270 L667,276 L657,282 L667,288 L657,294 L667,300 L662,306 L662,404" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="674" y="286" font-size="12" fill="#2b2b2b">load</text>

<!-- one ground rail. Cin starts it; every other return is a T. One symbol on the stub. -->
<line x1="118" y1="404" x2="700" y2="404" stroke="#2b2b2b" stroke-width="1.6"/>
<circle cx="168" cy="404" r="3" fill="#2b2b2b"/>
<circle cx="512" cy="404" r="3" fill="#2b2b2b"/>
<circle cx="590" cy="404" r="3" fill="#2b2b2b"/>
<circle cx="662" cy="404" r="3" fill="#2b2b2b"/>
<line x1="688" y1="404" x2="712" y2="404" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="692" y1="411" x2="708" y2="411" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="696" y1="418" x2="704" y2="418" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>

<text x="20" y="450" font-size="11.5" font-style="italic" fill="#555">A rising Vout lifts the + input, the gate rises, and the PMOS turns down. That is the negative feedback.</text>
</svg>
