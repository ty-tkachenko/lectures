<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Linear regulator pass element</title>
<desc id="d">Vin feeds the collector of an NPN pass transistor and the emitter is Vout. R1 runs from Vout to the feedback node and R2 from that node to ground. Feedback goes to the error amplifier minus input. A reference source to ground goes to the plus input. The amplifier output drives the base. Cout and the load both return from Vout to ground. Heat in the pass transistor is (Vin minus Vout) times the load current.</desc>
<rect width="760" height="460" fill="#ffffff"/>
<text x="20" y="24" font-size="14" font-weight="600" fill="#2b2b2b">Linear regulator: the pass element drops the spare volts</text>

<!-- input source -->
<text x="28" y="62" font-size="12" fill="#2b2b2b">Vin</text>
<line x1="64" y1="78" x2="64" y2="98" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="48" y1="98" x2="80" y2="98" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="56" y1="108" x2="72" y2="108" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="64" y1="108" x2="64" y2="360" stroke="#2b2b2b" stroke-width="1.6"/>
<path d="M64,78 L200,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>

<!-- NPN pass element: collector up (Vin), emitter down (Vout), base to the left -->
<circle cx="200" cy="118" r="28" fill="#fff" stroke="#b45309" stroke-width="1.8"/>
<line x1="186" y1="102" x2="186" y2="134" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="186" y1="110" x2="200" y2="90" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="200" y1="90" x2="200" y2="78" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="186" y1="126" x2="200" y2="146" stroke="#2b2b2b" stroke-width="1.6"/>
<polygon points="194,140 206,140 200,152" fill="#2b2b2b"/>
<line x1="200" y1="152" x2="200" y2="176" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="236" y="100" font-size="12" font-weight="600" fill="#b45309">P = (Vin − Vout)·I_load</text>
<text x="236" y="118" font-size="11" fill="#b45309">heat in the pass element</text>

<!-- Vout rail -->
<path d="M200,176 L640,176" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<circle cx="200" cy="176" r="3" fill="#2b2b2b"/>
<text x="214" y="168" font-size="12" font-weight="600" fill="#2b2b2b">Vout</text>

<!-- error amp, output up to the base -->
<polygon points="150,196 112,252 188,252" fill="#fff" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="150" y1="196" x2="150" y2="118" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="150" y1="118" x2="186" y2="118" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="118" y="246" font-size="13" fill="#2b2b2b">+</text>
<text x="168" y="246" font-size="13" fill="#2b2b2b">−</text>
<text x="96" y="188" font-size="11" fill="#555">error amp</text>

<!-- Vref into the plus input -->
<line x1="112" y1="252" x2="112" y2="302" stroke="#2b2b2b" stroke-width="1.6"/>
<circle cx="112" cy="316" r="14" fill="#fff" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="112" y="320" font-size="10" fill="#2b2b2b" text-anchor="middle">ref</text>
<line x1="112" y1="330" x2="112" y2="360" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="132" y="320" font-size="12" fill="#2b2b2b">Vref</text>

<!-- R1 from Vout to FB, R2 from FB to ground -->
<circle cx="340" cy="176" r="3" fill="#2b2b2b"/>
<path d="M340,176 L340,198 L345,204 L335,210 L345,216 L335,222 L345,228 L335,234 L345,240 L340,246 L340,262" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="352" y="228" font-size="12" fill="#2b2b2b">R1</text>
<circle cx="340" cy="262" r="3" fill="#2b2b2b"/>
<text x="352" y="266" font-size="12" font-weight="600" fill="#1d4ed8">FB</text>
<line x1="188" y1="252" x2="188" y2="262" stroke="#1d4ed8" stroke-width="1.4"/>
<line x1="188" y1="262" x2="340" y2="262" stroke="#1d4ed8" stroke-width="1.4"/>
<path d="M340,262 L340,284 L345,290 L335,296 L345,302 L335,308 L345,314 L335,320 L345,326 L340,332 L340,360" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="352" y="314" font-size="12" fill="#2b2b2b">R2</text>

<!-- Cout -->
<line x1="490" y1="176" x2="490" y2="210" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="474" y1="210" x2="506" y2="210" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="474" y1="220" x2="506" y2="220" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<text x="512" y="220" font-size="12" fill="#2b2b2b">Cout</text>
<line x1="490" y1="220" x2="490" y2="360" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- load -->
<path d="M600,176 L600,200 L605,206 L595,212 L605,218 L595,224 L605,230 L595,236 L605,242 L600,248 L600,360" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="612" y="236" font-size="12" fill="#2b2b2b">load</text>

<!-- ground rail -->
<line x1="64" y1="360" x2="640" y2="360" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="652" y1="360" x2="668" y2="360" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="656" y1="366" x2="664" y2="366" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="659" y1="372" x2="661" y2="372" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<text x="676" y="364" font-size="12" fill="#555">0 V</text>

<text x="20" y="412" font-size="11.5" font-style="italic" fill="#555">The amp drives the base until the divided Vout matches Vref. Cout and the load both return to 0 V.</text>
<text x="20" y="432" font-size="11.5" font-style="italic" fill="#555">Spare volts are dropped in the pass transistor and leave as heat.</text>
</svg>
