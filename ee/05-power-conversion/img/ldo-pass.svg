<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="ldoTitle ldoDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="ldoTitle">Linear regulator pass element</title>
  <desc id="ldoDesc">A pass transistor sits in series between the input and the output. An error amplifier compares a divided copy of the output with a reference and drives the pass element until the output matches the set voltage. The load is on the right, to ground. Spare input voltage is dropped across the pass element and becomes heat.</desc>
  <rect x="1" y="1" width="718" height="398" fill="#fff" stroke="#111"/>
  <text x="24" y="36" font-size="22" fill="#111">Linear regulator: the pass element drops the spare volts</text>
  <line x1="40" y1="150" x2="160" y2="150" stroke="#111" stroke-width="3"/>
  <text x="40" y="130" font-size="20" fill="#111">Vin</text>
  <rect x="160" y="110" width="150" height="80" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="178" y="156" font-size="20" fill="#111">pass element</text>
  <line x1="310" y1="150" x2="470" y2="150" stroke="#111" stroke-width="3"/>
  <text x="400" y="130" font-size="20" fill="#111">Vout</text>
  <line x1="470" y1="150" x2="470" y2="250" stroke="#0000cc" stroke-width="4"/>
  <rect x="430" y="250" width="80" height="70" fill="#fff" stroke="#0000cc" stroke-width="3"/>
  <text x="448" y="290" font-size="20" fill="#111">load</text>
  <line x1="470" y1="320" x2="470" y2="350" stroke="#0000cc" stroke-width="4"/>
  <line x1="440" y1="350" x2="500" y2="350" stroke="#111" stroke-width="3"/>
  <text x="510" y="356" font-size="18" fill="#111">0 V</text>
  <polyline points="360,150 360,210 250,210" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="200" y="190" width="50" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="214" y="216" font-size="18" fill="#111">R1</text>
  <line x1="225" y1="230" x2="225" y2="280" stroke="#111" stroke-width="2"/>
  <rect x="200" y="280" width="50" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="214" y="306" font-size="18" fill="#111">R2</text>
  <line x1="225" y1="320" x2="225" y2="350" stroke="#111" stroke-width="2"/>
  <polygon points="520,190 620,230 520,270" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="530" y="234" font-size="16" fill="#111">error</text>
  <line x1="250" y1="210" x2="520" y2="220" stroke="#111" stroke-width="2"/>
  <text x="300" y="200" font-size="16" fill="#111">feedback</text>
  <line x1="560" y1="270" x2="560" y2="310" stroke="#111" stroke-width="2"/>
  <text x="570" y="328" font-size="16" fill="#111">reference</text>
  <line x1="570" y1="230" x2="640" y2="150" stroke="#111" stroke-width="2"/>
  <line x1="640" y1="150" x2="235" y2="150" stroke="#111" stroke-width="2"/>
  <text x="24" y="390" font-size="18" fill="#111">Heat sits in the pass element: P = (Vin - Vout) x load current, plus a small quiescent term.</text>
</svg>
