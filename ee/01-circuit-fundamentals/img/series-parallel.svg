<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="spTitle spDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="spTitle">Series and parallel resistors</title>
  <desc id="spDesc">On the left, three resistors sit in one path so the same current flows through each and the voltages add. On the right, two resistors share both ends, so they see the same voltage and their currents add.</desc>
  <rect x="1" y="1" width="718" height="278" fill="#fff" stroke="#111"/>
  <text x="24" y="32" font-size="20" fill="#111">Series: one current. Parallel: one voltage.</text>
  <line x1="40" y1="90" x2="90" y2="90" stroke="#111" stroke-width="3"/>
  <rect x="90" y="72" width="70" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="125" y="96" font-size="16" fill="#111" text-anchor="middle">R1</text>
  <line x1="160" y1="90" x2="200" y2="90" stroke="#111" stroke-width="3"/>
  <rect x="200" y="72" width="70" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="235" y="96" font-size="16" fill="#111" text-anchor="middle">R2</text>
  <line x1="270" y1="90" x2="310" y2="90" stroke="#111" stroke-width="3"/>
  <rect x="310" y="72" width="70" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="345" y="96" font-size="16" fill="#111" text-anchor="middle">R3</text>
  <line x1="380" y1="90" x2="430" y2="90" stroke="#111" stroke-width="3"/>
  <text x="40" y="140" font-size="16" fill="#111">Same current in R1, R2, and R3.</text>
  <text x="40" y="164" font-size="16" fill="#111">Voltages add: V = V1 + V2 + V3.</text>
  <line x1="470" y1="80" x2="520" y2="80" stroke="#111" stroke-width="3"/>
  <line x1="520" y1="80" x2="520" y2="150" stroke="#111" stroke-width="3"/>
  <rect x="520" y="96" width="70" height="32" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="555" y="118" font-size="16" fill="#111" text-anchor="middle">R1</text>
  <rect x="520" y="150" width="70" height="32" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="555" y="172" font-size="16" fill="#111" text-anchor="middle">R2</text>
  <line x1="590" y1="80" x2="590" y2="182" stroke="#111" stroke-width="3"/>
  <line x1="590" y1="80" x2="660" y2="80" stroke="#111" stroke-width="3"/>
  <line x1="590" y1="182" x2="660" y2="182" stroke="#111" stroke-width="3"/>
  <text x="470" y="220" font-size="16" fill="#111">Same voltage. Currents add.</text>
  <text x="24" y="250" font-size="16" fill="#111">Series resistance is the sum. Two parallel resistors combine as R1 times R2, divided by R1 plus R2.</text>
</svg>
