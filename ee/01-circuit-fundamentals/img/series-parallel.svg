<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Series and parallel resistors</title>
<desc id="d">Left: a source and three resistors in one loop, so the same current flows through each and the voltages add. Right: two resistors share both ends of the same source, so they see the same voltage and their currents add.</desc>
<defs>
<marker id="ah555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#555"/></marker>
<marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker>
</defs>
<rect width="760" height="320" fill="#ffffff"/>
<text x="20" y="24" font-size="14" font-weight="600" fill="#2b2b2b">Series: one current. Parallel: one voltage.</text>

<!-- series loop -->
<line x1="48" y1="78" x2="48" y2="108" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="32" y1="108" x2="64" y2="108" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="40" y1="118" x2="56" y2="118" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="48" y1="118" x2="48" y2="196" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="28" y="74" font-size="12" fill="#2b2b2b">V</text>
<path d="M48,78 L118,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M118,78 L124,78 L130,83 L136,73 L142,83 L148,73 L154,83 L160,73 L166,83 L172,78 L178,78" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="148" y="66" font-size="12" fill="#2b2b2b" text-anchor="middle">R1</text>
<path d="M178,78 L208,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M208,78 L214,78 L220,83 L226,73 L232,83 L238,73 L244,83 L250,73 L256,83 L262,78 L268,78" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="238" y="66" font-size="12" fill="#2b2b2b" text-anchor="middle">R2</text>
<path d="M268,78 L298,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M298,78 L304,78 L310,83 L316,73 L322,83 L328,73 L334,83 L340,73 L346,83 L352,78 L358,78" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="328" y="66" font-size="12" fill="#2b2b2b" text-anchor="middle">R3</text>
<path d="M358,78 L400,78 L400,196 L48,196" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<line x1="86" y1="96" x2="128" y2="96" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ah1d4ed8)"/>
<text x="78" y="100" font-size="12" fill="#1d4ed8" text-anchor="end">I</text>
<text x="48" y="230" font-size="12" fill="#555">Same current in R1, R2, and R3.</text>
<text x="48" y="248" font-size="12" fill="#555">Voltages add: V = V1 + V2 + V3.</text>

<!-- parallel -->
<line x1="470" y1="78" x2="470" y2="108" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="454" y1="108" x2="486" y2="108" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="462" y1="118" x2="478" y2="118" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="470" y1="118" x2="470" y2="196" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="450" y="74" font-size="12" fill="#2b2b2b">V</text>
<path d="M470,78 L560,78 L700,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M700,78 L700,196 L470,196" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M560,78 L560,96 L565,102 L555,108 L565,114 L555,120 L565,126 L555,132 L565,138 L560,144 L560,196" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="548" y="128" font-size="12" fill="#2b2b2b" text-anchor="end">R1</text>
<path d="M640,78 L640,96 L645,102 L635,108 L645,114 L635,120 L645,126 L635,132 L645,138 L640,144 L640,196" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="628" y="128" font-size="12" fill="#2b2b2b" text-anchor="end">R2</text>
<line x1="548" y1="92" x2="548" y2="112" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ah1d4ed8)"/>
<text x="560" y="68" font-size="11" fill="#1d4ed8" text-anchor="middle">I1</text>
<line x1="628" y1="92" x2="628" y2="112" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ah1d4ed8)"/>
<text x="640" y="68" font-size="11" fill="#1d4ed8" text-anchor="middle">I2</text>
<text x="470" y="230" font-size="12" fill="#555">Same voltage across R1 and R2.</text>
<text x="470" y="248" font-size="12" fill="#555">Currents add: I = I1 + I2.</text>

<text x="20" y="292" font-size="11.5" font-style="italic" fill="#555">Series resistance is the sum. Two parallel resistors combine as R1·R2 / (R1 + R2).</text>
</svg>
