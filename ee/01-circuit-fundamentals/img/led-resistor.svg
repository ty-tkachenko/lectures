<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">LED with a series resistor</title>
<desc id="d">A battery, a resistor, and an LED in one series loop. The resistor drops Vs minus the LED forward voltage, and that sets the current. The LED is drawn as a diode with light arrows, not as a resistor.</desc>
<defs>
<marker id="ahb45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b45309"/></marker>
<marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker>
</defs>
<rect width="760" height="280" fill="#ffffff"/>
<text x="20" y="24" font-size="14" font-weight="600" fill="#2b2b2b">The resistor, not the LED, sets the current</text>

<line x1="70" y1="78" x2="70" y2="108" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="54" y1="108" x2="86" y2="108" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="62" y1="118" x2="78" y2="118" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="70" y1="118" x2="70" y2="190" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="40" y="72" font-size="12" fill="#2b2b2b">Vs</text>
<text x="92" y="116" font-size="11" fill="#555">+</text>

<path d="M70,78 L160,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M160,78 L166,78 L172,83 L178,73 L184,83 L190,73 L196,83 L202,73 L208,83 L214,78 L220,78" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="190" y="64" font-size="12" fill="#2b2b2b" text-anchor="middle">R</text>
<text x="190" y="104" font-size="11.5" fill="#b45309" text-anchor="middle">drops Vs − Vf</text>
<path d="M220,78 L310,78" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>

<!-- LED: anode left, cathode bar, light arrows -->
<path d="M310,62 L310,94 L338,78 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="338" y1="60" x2="338" y2="96" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="348" y1="58" x2="366" y2="46" stroke="#b45309" stroke-width="1.4" marker-end="url(#ahb45309)"/>
<line x1="352" y1="72" x2="372" y2="64" stroke="#b45309" stroke-width="1.4" marker-end="url(#ahb45309)"/>
<text x="352" y="100" font-size="12" fill="#2b2b2b">LED</text>
<path d="M338,78 L470,78 L470,190 L70,190" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<line x1="250" y1="128" x2="290" y2="128" stroke="#1d4ed8" stroke-width="1.4" marker-end="url(#ah1d4ed8)"/>
<text x="242" y="132" font-size="12" fill="#1d4ed8" text-anchor="end">I</text>

<text x="20" y="236" font-size="11.5" font-style="italic" fill="#555">I = (Vs − Vf) / R. The LED is a diode, not a resistor. Without R, the battery decides the current.</text>
<text x="20" y="256" font-size="11.5" font-style="italic" fill="#555">Anode is the triangle, cathode is the bar. Light leaves the arrow side.</text>
</svg>
