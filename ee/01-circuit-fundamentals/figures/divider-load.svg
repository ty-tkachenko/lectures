<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="divTitle divDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="divTitle">Voltage divider with a load</title>
  <desc id="divDesc">A source feeds R1, then a node, then R2 to the 0 V rail. A load resistor hangs on that same node. The load is in parallel with R2, so the output is lower than the unloaded divider formula.</desc>
  <rect x="1" y="1" width="718" height="318" fill="#fff" stroke="#111"/>
  <text x="24" y="32" font-size="20" fill="#111">The load shares current with R2</text>
  <text x="40" y="78" font-size="18" fill="#111">Vin</text>
  <line x1="90" y1="90" x2="160" y2="90" stroke="#111" stroke-width="3"/>
  <rect x="160" y="72" width="80" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="200" y="96" font-size="18" fill="#111" text-anchor="middle">R1</text>
  <line x1="240" y1="90" x2="340" y2="90" stroke="#111" stroke-width="3"/>
  <circle cx="340" cy="90" r="5" fill="#111"/>
  <text x="360" y="78" font-size="18" fill="#111">Vout</text>
  <line x1="340" y1="90" x2="340" y2="150" stroke="#111" stroke-width="3"/>
  <rect x="300" y="150" width="80" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="340" y="174" font-size="18" fill="#111" text-anchor="middle">R2</text>
  <line x1="340" y1="186" x2="340" y2="250" stroke="#111" stroke-width="3"/>
  <line x1="200" y1="250" x2="520" y2="250" stroke="#111" stroke-width="3"/>
  <text x="530" y="256" font-size="16" fill="#111">0 V</text>
  <line x1="340" y1="90" x2="480" y2="90" stroke="#0000cc" stroke-width="3"/>
  <line x1="480" y1="90" x2="480" y2="150" stroke="#0000cc" stroke-width="3"/>
  <rect x="440" y="150" width="80" height="36" fill="#fff" stroke="#0000cc" stroke-width="2"/>
  <text x="480" y="174" font-size="18" fill="#111" text-anchor="middle">Rload</text>
  <line x1="480" y1="186" x2="480" y2="250" stroke="#0000cc" stroke-width="3"/>
  <text x="24" y="292" font-size="16" fill="#111">Unloaded, Vout = Vin times R2 / (R1 + R2). With a load, R2 and Rload are in parallel first.</text>
</svg>
