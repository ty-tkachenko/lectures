<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capacitors and inductors widgets</title>
  <link rel="stylesheet" href="../../../assets/css/widgets.css">
  <style>
/* Widget chrome copied from the RF demo pages (rf/00, rf/01, rf/02 widgets/demo.html).
   Those files keep their CSS inline. This sheet is for EE pages and EE demos.
   Lesson pages stay in the site serif. Standalone demos set class="widget-demo" on body. */

body.widget-demo {
  font-family: Inter, system-ui, sans-serif;
  max-width: 820px;
  margin: 2rem auto;
  padding: 0 1rem;
  color: #2b2b2b;
  line-height: 1.6;
  background: #fff;
}

.widget {
  border: 1px solid #eee;
  border-radius: 10px;
  padding: 1rem 1.25rem;
  margin: 2rem 0;
  background: #fff;
  font-family: Inter, system-ui, sans-serif;
  color: #2b2b2b;
  line-height: 1.6;
}

.widget h3 { margin: 0.2rem 0 0.8rem; }

.widget label {
  display: block;
  font-size: 0.9rem;
  color: #555;
  margin: 0.5rem 0 0.2rem;
}

.widget label.inline { display: inline-block; margin-right: 1rem; }

.widget input[type="range"] { width: 100%; }

.widget select,
.widget input[type="number"] { padding: 0.2rem; }

.widget input[type="number"] { width: 6rem; }

.widget button {
  font: inherit;
  font-size: 0.85rem;
  padding: 0.2rem 0.6rem;
  margin: 0.2rem 0.3rem 0.2rem 0;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
}

.widget button:hover { background: #eff6ff; }

.widget .row,
.widget .controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 1.25rem;
}

.widget .readout,
.widget .widget-readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.5rem;
  margin: 0.8rem 0;
}

.widget .readout div,
.widget .widget-readout div {
  background: #eff6ff;
  border-radius: 8px;
  padding: 0.4rem 0.6rem;
  margin: 0;
  font-size: 0.9rem;
}

.widget .readout b,
.widget .readout strong,
.widget .widget-readout b,
.widget .widget-readout strong {
  display: block;
  font-size: 1.1rem;
  color: #1d4ed8;
}

.widget canvas,
.widget svg {
  width: 100%;
  height: auto;
  display: block;
  margin: 0.4rem 0;
  border-radius: 8px;
  background: #fafafa;
}

.widget .try {
  font-size: 0.9rem;
  background: #fffbeb;
  border: 0;
  border-left: 3px solid #f59e0b;
  border-radius: 0;
  padding: 0.5rem 0.75rem;
  margin: 0.8rem 0 0;
}

.widget .verdict,
.widget .widget-warn {
  font-weight: 600;
  border: 0;
  background: transparent;
  color: #b45309;
  padding: 0.2rem 0;
  margin: 0.4rem 0;
}

.widget .legend,
.widget .noscript-note,
.widget .widget-plot-label {
  font-size: 0.85rem;
  color: #555;
  font-weight: normal;
  font-style: normal;
  margin: 0.35rem 0;
}

.widget .legend span {
  display: inline-block;
  width: 14px;
  height: 3px;
  vertical-align: middle;
  margin: 0 0.3rem 0 0.8rem;
}

.widget .slider-row {
  display: block;
  margin: 0.15rem 0 0.35rem;
}

.widget .slider-row label {
  display: block;
  font-size: 0.9rem;
  color: #555;
  margin: 0.5rem 0 0.2rem;
}

.widget .slider-row .slider-value {
  font-weight: 600;
  color: #1d4ed8;
  font-variant-numeric: tabular-nums;
}

.widget .slider-row input[type="range"] {
  display: block;
  width: 100%;
  height: auto;
  margin: 0.15rem 0 0.2rem;
  grid-column: auto;
}

@media (max-width: 640px) {
  .widget .row,
  .widget .controls { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="widget-demo">
  <header id="demo-banner">
    <h1>Capacitors and inductors widgets</h1>
    <p>Open this page with <code>?w=</code> and an id from the module front matter to show one widget. The reading page embeds them that way.</p>
  </header>
  <div class="widget" data-widget="rc-scope" data-prompt="The defaults are 10 kilohms and 100 nanofarads, so tau is 1 ms, on a 100 Hz square wave. Raise the frequency until half a period is shorter than tau. The capacitor stops reaching the rails. That rounding is the circuit refusing to jump."></div>
  <div class="widget" data-widget="rl-kickback" data-prompt="Leave the coil at 1 mH and the current at 200 mA. Turn the diode off and read the model spike for a 1 microsecond turn-off. Turn the diode on and compare that spike with supply plus one diode drop."></div>
  <div class="widget" data-widget="impedance-plot" data-prompt="Set R to 1.6 kilohms and C to 100 nanofarads. The frequency where the capacitor curve crosses the flat resistor line is the cutoff of the low-pass in the next section. The inductor rises the other way."></div>
  <div class="widget" data-widget="rc-filter" data-prompt="The defaults are 1.6 kilohms and 100 nanofarads, cutoff near 1 kHz. Read the minus 3 dB line. Then switch to high-pass and watch the time plot keep the fast wiggle and lose the slow one."></div>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("w");
      if (!id) return;
      var banner = document.getElementById("demo-banner");
      if (banner) banner.remove();
      var found = false;
      document.querySelectorAll(".widget[data-widget]").forEach(function (node) {
        if (node.getAttribute("data-widget") === id) found = true;
        else node.remove();
      });
      if (!found) {
        var note = document.createElement("p");
        note.textContent = "No widget named " + id + " on this page.";
        document.body.appendChild(note);
      }
    })();
  </script>
  <script src="../../../assets/widgets.js"></script>
</body>
</html>
