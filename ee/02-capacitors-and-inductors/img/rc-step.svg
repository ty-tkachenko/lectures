<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="rcTitle rcDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="rcTitle">RC step response</title>
  <desc id="rcDesc">A resistor feeds a capacitor to ground. Beside the schematic, the capacitor voltage rises as a curve toward the source voltage, passing 63 percent at one time constant and nearly finishing at five.</desc>
  <rect x="1" y="1" width="718" height="278" fill="#fff" stroke="#111"/>
  <text x="24" y="32" font-size="20" fill="#111">The capacitor voltage cannot jump</text>
  <line x1="40" y1="90" x2="90" y2="90" stroke="#111" stroke-width="3"/>
  <text x="40" y="76" font-size="16" fill="#111">step</text>
  <rect x="90" y="72" width="70" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="125" y="96" font-size="16" fill="#111" text-anchor="middle">R</text>
  <line x1="160" y1="90" x2="230" y2="90" stroke="#111" stroke-width="3"/>
  <line x1="230" y1="70" x2="230" y2="130" stroke="#111" stroke-width="3"/>
  <line x1="250" y1="70" x2="250" y2="130" stroke="#111" stroke-width="3"/>
  <text x="262" y="104" font-size="16" fill="#111">C</text>
  <line x1="240" y1="130" x2="240" y2="170" stroke="#111" stroke-width="2"/>
  <line x1="40" y1="170" x2="280" y2="170" stroke="#111" stroke-width="2"/>
  <text x="40" y="200" font-size="16" fill="#111">tau = R C</text>
  <line x1="360" y1="200" x2="680" y2="200" stroke="#111" stroke-width="2"/>
  <line x1="380" y1="60" x2="380" y2="200" stroke="#111" stroke-width="2"/>
  <path d="M380 190 C 460 188, 500 80, 660 70" fill="none" stroke="#0000cc" stroke-width="3"/>
  <line x1="470" y1="70" x2="470" y2="200" stroke="#111" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="476" y="90" font-size="14" fill="#111">1 tau, 63%</text>
  <text x="500" y="230" font-size="14" fill="#111">time</text>
  <text x="300" y="80" font-size="14" fill="#111">Vc</text>
</svg>
