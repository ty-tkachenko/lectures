<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">Flyback diode across a coil</title>
<desc id="d">A coil sits between the supply and a low-side switch. A diode is in parallel with the coil, cathode toward the supply, so it is off while the switch is closed. When the switch opens, inductor current circulates through the diode instead of spiking the switch node.</desc>
<defs>
<marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker>
</defs>
<rect width="760" height="320" fill="#ffffff"/>
<text x="20" y="24" font-size="14" font-weight="600" fill="#2b2b2b">The diode gives the coil current a path</text>

<!-- supply -->
<text x="36" y="108" font-size="12" fill="#2b2b2b">Vs</text>
<line x1="78" y1="128" x2="78" y2="148" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="62" y1="148" x2="94" y2="148" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="70" y1="158" x2="86" y2="158" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="78" y1="158" x2="78" y2="250" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="78" y1="250" x2="520" y2="250" stroke="#2b2b2b" stroke-width="1.6"/>

<!-- top of supply to coil node -->
<path d="M78,128 L180,128" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<circle cx="180" cy="128" r="3" fill="#2b2b2b"/>

<!-- coil -->
<path d="M180,128 L200,128 A10,10 0 0 1 220,128 A10,10 0 0 1 240,128 A10,10 0 0 1 260,128 A10,10 0 0 1 280,128 L300,128" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<text x="240" y="158" font-size="12" fill="#2b2b2b" text-anchor="middle">L</text>
<circle cx="300" cy="128" r="3" fill="#2b2b2b"/>
<text x="312" y="122" font-size="12" fill="#555">switch node</text>

<!-- low-side switch, drawn open -->
<line x1="300" y1="128" x2="300" y2="168" stroke="#2b2b2b" stroke-width="1.6"/>
<circle cx="300" cy="172" r="3.5" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/>
<line x1="304" y1="176" x2="338" y2="206" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="300" cy="214" r="3.5" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4"/>
<line x1="300" y1="218" x2="300" y2="250" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="348" y="198" font-size="12" fill="#2b2b2b">switch</text>

<!-- diode above the coil, cathode toward Vs (left) -->
<line x1="180" y1="128" x2="180" y2="78" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="300" y1="128" x2="300" y2="78" stroke="#1d4ed8" stroke-width="1.6"/>
<!-- cathode bar on the left, triangle pointing left so forward current is toward Vs -->
<line x1="198" y1="64" x2="198" y2="92" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/>
<path d="M220,64 L220,92 L206,78 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="220" y1="78" x2="300" y2="78" stroke="#1d4ed8" stroke-width="1.6"/>
<line x1="180" y1="78" x2="198" y2="78" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="228" y="58" font-size="12" font-weight="600" fill="#1d4ed8">cathode toward Vs</text>

<!-- freewheel current -->
<line x1="168" y1="100" x2="168" y2="78" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#ah1d4ed8)"/>
<text x="160" y="96" font-size="11" fill="#1d4ed8" text-anchor="end">freewheel</text>

<text x="20" y="284" font-size="11.5" font-style="italic" fill="#555">Switch closed: the diode is reverse biased and coil current goes to ground through the switch.</text>
<text x="20" y="304" font-size="11.5" font-style="italic" fill="#555">Switch open: that current loops through the diode at about one forward drop above Vs, instead of a kilovolt spike.</text>
</svg>
