<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="fltTitle fltDesc" font-family="Georgia, 'Times New Roman', serif">
  <title id="fltTitle">RC low-pass and high-pass</title>
  <desc id="fltDesc">The low-pass has a series resistor and a capacitor to ground, and the output is across the capacitor. The high-pass swaps them: a series capacitor and a resistor to ground, and the output is across the resistor. Both use fc = 1 over 2 pi R C.</desc>
  <rect x="1" y="1" width="718" height="258" fill="#fff" stroke="#111"/>
  <text x="24" y="32" font-size="20" fill="#111">Same two parts, output taken on the other one</text>
  <text x="40" y="70" font-size="16" fill="#111">Low-pass</text>
  <line x1="40" y1="100" x2="90" y2="100" stroke="#111" stroke-width="3"/>
  <rect x="90" y="82" width="60" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="120" y="106" font-size="16" fill="#111" text-anchor="middle">R</text>
  <line x1="150" y1="100" x2="220" y2="100" stroke="#111" stroke-width="3"/>
  <line x1="220" y1="82" x2="220" y2="140" stroke="#111" stroke-width="3"/>
  <line x1="240" y1="82" x2="240" y2="140" stroke="#111" stroke-width="3"/>
  <text x="248" y="116" font-size="16" fill="#111">C</text>
  <text x="150" y="170" font-size="14" fill="#111">Vout on C. Slow signals pass.</text>
  <text x="400" y="70" font-size="16" fill="#111">High-pass</text>
  <line x1="400" y1="100" x2="450" y2="100" stroke="#111" stroke-width="3"/>
  <line x1="450" y1="82" x2="450" y2="118" stroke="#111" stroke-width="3"/>
  <line x1="470" y1="82" x2="470" y2="118" stroke="#111" stroke-width="3"/>
  <line x1="470" y1="100" x2="540" y2="100" stroke="#111" stroke-width="3"/>
  <rect x="540" y="82" width="60" height="36" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="570" y="106" font-size="16" fill="#111" text-anchor="middle">R</text>
  <line x1="570" y1="118" x2="570" y2="150" stroke="#111" stroke-width="2"/>
  <line x1="500" y1="150" x2="640" y2="150" stroke="#111" stroke-width="2"/>
  <text x="400" y="190" font-size="14" fill="#111">Vout on R. Fast signals pass.</text>
  <text x="24" y="230" font-size="16" fill="#111">Cutoff for both: fc = 1 / (2 pi R C). At fc the magnitude is 0.707, which is -3 dB.</text>
</svg>
