<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="t">RC low-pass and high-pass</title>
<desc id="d">Low-pass: series resistor, capacitor to ground, output across the capacitor. High-pass: series capacitor, resistor to ground, output across the resistor. Both return to the source ground. Cutoff is 1 over 2 pi R C.</desc>
<rect width="760" height="320" fill="#ffffff"/>
<text x="20" y="24" font-size="14" font-weight="600" fill="#2b2b2b">Same two parts, output taken on the other one</text>

<!-- low-pass -->
<text x="48" y="64" font-size="12.5" font-weight="600" fill="#1d4ed8">Low-pass</text>
<text x="36" y="96" font-size="12" fill="#2b2b2b">Vin</text>
<path d="M70,112 L120,112" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<path d="M120,112 L126,112 L132,117 L138,107 L144,117 L150,107 L156,117 L162,107 L168,117 L174,112 L180,112" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="150" y="98" font-size="12" fill="#2b2b2b" text-anchor="middle">R</text>
<path d="M180,112 L250,112" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<circle cx="250" cy="112" r="3" fill="#2b2b2b"/>
<text x="262" y="106" font-size="12" font-weight="600" fill="#1d4ed8">Vout</text>
<line x1="250" y1="112" x2="250" y2="142" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="234" y1="142" x2="266" y2="142" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="234" y1="152" x2="266" y2="152" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<text x="274" y="152" font-size="12" fill="#2b2b2b">C</text>
<line x1="250" y1="152" x2="250" y2="200" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="238" y1="200" x2="262" y2="200" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="242" y1="206" x2="258" y2="206" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="246" y1="212" x2="254" y2="212" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="70" y1="200" x2="250" y2="200" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="70" y1="112" x2="70" y2="200" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="48" y="242" font-size="12" fill="#555">Vout is on C. Slow signals pass.</text>

<!-- high-pass -->
<text x="430" y="64" font-size="12.5" font-weight="600" fill="#b45309">High-pass</text>
<text x="408" y="96" font-size="12" fill="#2b2b2b">Vin</text>
<path d="M450,112 L500,112" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<!-- series capacitor: vertical plates -->
<line x1="500" y1="98" x2="500" y2="126" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="510" y1="98" x2="510" y2="126" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round"/>
<text x="492" y="94" font-size="12" fill="#2b2b2b" text-anchor="middle">C</text>
<path d="M510,112 L590,112" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
<circle cx="590" cy="112" r="3" fill="#2b2b2b"/>
<text x="602" y="106" font-size="12" font-weight="600" fill="#b45309">Vout</text>
<path d="M590,112 L590,136 L595,142 L585,148 L595,154 L585,160 L595,166 L585,172 L595,178 L590,184 L590,200" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
<text x="604" y="164" font-size="12" fill="#2b2b2b">R</text>
<line x1="578" y1="200" x2="602" y2="200" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="582" y1="206" x2="598" y2="206" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="586" y1="212" x2="594" y2="212" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="450" y1="200" x2="590" y2="200" stroke="#2b2b2b" stroke-width="1.6"/>
<line x1="450" y1="112" x2="450" y2="200" stroke="#2b2b2b" stroke-width="1.6"/>
<text x="430" y="242" font-size="12" fill="#555">Vout is on R. Fast signals pass.</text>

<text x="20" y="284" font-size="11.5" font-style="italic" fill="#555">Cutoff for both: fc = 1 / (2πRC). At fc the magnitude is 0.707, which is −3 dB.</text>
<text x="20" y="304" font-size="11.5" font-style="italic" fill="#555">Each source lead returns to the same ground as the shunt part, so the loop is closed.</text>
</svg>
